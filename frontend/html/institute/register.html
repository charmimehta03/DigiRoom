<!DOCTYPE html>
<html>
<head>
    <title>Institute Register</title>
</head>
<body>
    <h2>Register Institute</h2>

    <form action="/institute/register" method="post">

    <input type="text" name="institute_name" placeholder="Institute Name" required><br><br>

    <input type="email" name="email" placeholder="Email" required><br><br>

    <input type="password" name="password" placeholder="Password" required><br><br>

    <input type="text" name="institute_code" placeholder="Institute Code" required><br><br>

    <button type="submit">Register</button>

</form>

<button onclick="location.href='/institute/login'">Login</button>
</body>
</html>
