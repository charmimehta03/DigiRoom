<!DOCTYPE html>
<html>
<head>
    <title>Materials</title>
    <link rel="stylesheet" href="/static/css/materials.css">
</head>
<body>

<h1>Materials</h1>
<button onclick="showSection('presentations')">
    Presentations
</button>

<button onclick="showSection('documents')">
    Documents
</button>

<button onclick="showSection('recordings')">
    Recordings
</button>
<hr>
<hr>

<input
    type="text"
    id="search"
    placeholder="Search..."
>



<div id="presentations-section">

    <h2>Presentations</h2>

    <table border="1">

        <thead>

            <tr>

                <th>Date</th>

                <th>Lecture</th>

                <th>Subject</th>

                <th>File Name</th>

                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="presentations-table">

        </tbody>

    </table>

</div>


<div
    id="documents-section"
    style="display:none;"
>

    <h2>Documents</h2>

    <form
        id="upload-form"
        enctype="multipart/form-data"
    >

        <select id="lecture">

            <option value="">
                Select Lecture
            </option>

        </select>

        <br><br>

        <input
            type="file"
            id="document"
        >

        <br><br>

        <button type="submit">
            Upload
        </button>

    </form>

    <hr>

    <table border="1">

        <thead>

            <tr>

                <th>Date</th>

                <th>Lecture</th>

                <th>Subject</th>

                <th>File Name</th>

                <th>Type</th>

                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="documents-table">

        </tbody>

    </table>

</div>


<div
    id="recordings-section"
    style="display:none;"
>

    <h2>Recordings</h2>

    <table border="1">

        <thead>

            <tr>

                <th>Date</th>

                <th>Lecture</th>

                <th>Subject</th>

                <th>Duration</th>

                <th>Attendance</th>

                <th>Attention</th>

                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="recordings-table">

        </tbody>

    </table>

</div>

<script src="/static/js/materials.js"></script>

</body>
</html>
