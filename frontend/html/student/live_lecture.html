<!DOCTYPE html>

<html>

<head>
    <title>DigiRoom Live Lecture</title>

```
<link rel="stylesheet" href="/static/css/student_live_lecture.css">
```

</head>

<body>

<div class="ambient"></div>

<div class="lecture-container">

```
<div class="lecture-header">

    <h1 id="lectureTitle">
        Loading...
    </h1>

    <h3 id="subjectName"></h3>

</div>

<div class="main-video-section">

    <div class="teacher-section">

        <div class="section-title">
            Teacher Live Stream
            <span id="teacherMicIndicator">🎤</span>
        </div>

        <video
            id="teacherVideo"
            autoplay
            playsinline
            controls
        ></video>

    </div>

</div>

<div
    id="screenShareSection"
    class="screen-share-section"
    style="display:none;"
>

    <h2>Screen Share</h2>

    <video
        id="screenVideo"
        autoplay
        playsinline
        controls
    ></video>

</div>

<div class="bottom-grid">

    <div class="student-section">

        <h2>Your Camera</h2>

        <video
            id="studentPreview"
            autoplay
            muted
            playsinline
        ></video>

        <div class="controls">

            <button id="toggleCamera">
                📷 Camera
            </button>

            <button id="toggleMic">
                🎤 Mic
            </button>

        </div>

    </div>

    <div class="chat-section">

        <h2>Live Chat</h2>

        <div id="chatMessages"></div>

        <div class="chat-input-row">

            <input
                type="text"
                id="chatInput"
                placeholder="Type message..."
            >

            <button id="sendChat">
                Send
            </button>

        </div>

    </div>

</div>

<div class="poll-section">

    <h2>Live Polls</h2>

    <div id="pollPanel">
        No active poll.
    </div>

</div>

<div class="leave-container">

    <button id="leaveLecture">
        Leave Lecture
    </button>

</div>
```

</div>

<script src="/static/js/socket.io.min.js"></script>

<script src="/static/js/student_live_lecture.js"></script>

<script src="/static/js/webrtc_student.js"></script>

<script src="/static/js/chat.js"></script>

<script src="/static/js/poll.js"></script>

<script type="module" src="/static/js/attention_tracker.js"></script>

</body>

</html>
